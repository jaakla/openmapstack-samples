schema: openmapstack-project/v1
project:
  id: helsinki-battlefield-visibility
  title: UAV visibility · simulated scenario
  question: Explore dynamic geometric visibility of simulated UAVs over measured downtown
    Helsinki geometry.
  created_at: '2026-10-17T11:30:00Z'
  updated_at: '2026-10-17T16:37:10.756033+00:00'
  status: validated
  publication:
    updated_at: '2026-10-17T00:00:00Z'
    status: published
    author:
      name: Jaak Laineste
      email: jaak@goplex.ee
    generated_with:
      tool: OpenMapStack
      url: https://github.com/jaakla/openmapstack-skills
interpretation:
  objective: Reproducible open-data educational 3D simulation, independent of toompea-3d.
  assumptions:
  - id: A1
    statement: AOI is the chosen EPSG:3067 rectangle [385200,6671300,386500,6672500],
      1.3 × 1.2 km. Vertical heights retain Helsinki N2000.
    rationale: A metric local analysis with explicit XY reprojection from EPSG:3879.
  - id: A2
    statement: City flights 11–15 June 2021, nominal nadir density 40 points/m². Data
      do not assert present-day conditions.
    rationale: Epoch pinned to an explicitly open CC BY 4.0 survey.
  - id: A3
    statement: 'DTM: mean class 2 ground and class 8 keypoints per 1 m cell; GDAL
      inverse-distance FillNodata up to 60 m. Beyond that remains unknown.'
    rationale: Ground below buildings must be interpolated; no invented replacement
      city geometry.
  - id: A4
    statement: 'Obstruction DSM: DTM plus maximum class 6 buildings, class 17 bridge
      deck, and classes 3/4/5 vegetation only at least 2 m above DTM. Unknown classes
      are excluded.'
    rationale: Measured 2.5D opaque canopy/roof columns; no windows, underpasses or
      canopy permeability.
  - id: A5
    statement: DTM quantization 0.1 m rounded, DSM quantization 0.1 m rounded up.
      Unknown values are 65535. Source units are metres.
    rationale: Compact browser payload with conservative obstruction rounding.
  - id: A6
    statement: SIMULATED UAVs follow sourced OSM route shapes at 8 m/s, 50 m AGL by
      default. They do not represent observed flights or forces.
    rationale: User-requested illustrative simulation; not operational intelligence.
  - id: A7
    statement: Five minute prediction samples each 60 s under three equal speed hypotheses
      0.8/1.0/1.2. Yellow means ≥0.25 of hypotheses find any sampled visibility for
      at least one vector.
    rationale: Uncalibrated scenario weights; brief visibility between samples can
      be missed.
  - id: A8
    statement: Target is 2 m AGL; zone display samples at 20 m spacing. LOS traverses
      every crossed 1 m DSM cell. Missing/obstructed targets stay unknown.
    rationale: Coarse target sampling bounds CPU cost; GREEN does not establish safety.
  - id: A9
    statement: Browser computation is exploratory over published rasters. Vectors,
      paths, readout and overlay share one timestamped worker snapshot. Reset returns
      to t=0 and manifest defaults.
    rationale: Avoid misleading correspondence between current movement and an older
      zone result.
  - id: A10
    statement: Vegetation is treated as opaque for the June 2021 epoch; seasonality
      and classification errors change actual visibility. Earth curvature/refraction
      and sensor detection physics are omitted.
    rationale: The model estimates geometric line of sight only, at neighbourhood
      scale.
  - id: A11
    statement: Building rendering is a replaceable source-backed mesh layer, separate
      from the unchanged 1 m LiDAR DSM. Vegetation is a deterministic subsample of
      measured returns; UAV props are magnified 9× for legibility.
    rationale: Display simplification and annotation sizes do not change 1 m obstruction
      calculations.
  - id: A12
    statement: Surface OSM graph excludes tunnels, bridges, nonzero layer, private/no
      motor access and non-motor road types; oneway tags are respected in route construction.
      Reversal at route ends is a simulated turn.
    rationale: A simplified street-following demonstration, not a routable operational
      movement planner.
  - id: A13
    statement: MGRS is a one-metre display reference in WGS84; internal metric analysis
      remains EPSG:3067/N2000. Entered references select the grid-square centre; the
      ETRS89/WGS84 display approximation is not survey positioning.
    rationale: Separate coordinate notation from analysis and disclose datum/display
      precision.
  - id: A14
    statement: Past traces cover elapsed simulation time up to 120 s. Future route
      and terminal speed envelope use 0.8/1.0/1.2 speed scenarios over 300 s. The
      16 m wide visual ribbon is an annotation of along-route terminal uncertainty,
      not a lateral accuracy bound.
    rationale: Distinct past/future styles, real source vertices and explicit scenario
      uncertainty.
  - id: A15
    statement: Official Helsinki untextured LoD2, tilesetVersion 291269823412, HTTP
      export 2026-05-11; acquisition epoch is unknown for this continuously maintained
      model. 15 leaf b3dm tiles are decoded, reprojected, triangle-clipped and quantized
      to 2 cm for display. LiDAR DSM remains the sole obstruction input.
    rationale: Real roofs and source IDs with explicit display-versus-analysis provenance;
      epoch differences are measured, not fitted away.
  - id: A16
    statement: Relative UAV contacts use EPSG:3067 grid north, 6400 mil per turn and
      N2000 height above stationary OWN at DTM + 2 m. Local true bearing is grid bearing
      plus meridian convergence at OWN. Range rate is horizontal, negative closing;
      course is the outgoing ground-track segment, not body heading. Magnetic declination
      and vertical velocity are not modelled.
    rationale: Explicit reference frames and signed simulated quantities; no inferred
      own orientation or clock directions. All contact fields share the LOS snapshot.
