validation:
  required:
  - source_hashes_match
  - source_result_complete
  - crs_known
  - geometry_valid
  - row_count_gt_zero
  - obstruction_includes_buildings_and_vegetation
  - dtm_coverage
  - street_routes_follow_source
  - overrides_applied
  - manifest_graph_resolves
  - view_controls_match_pipeline
  - payload_lt_20mb
  - analytic_los_tests
  - qgis_project_static_valid
  - qgis_layers_valid
  - manifest_report_parity
  - archived_sources_reproducible
  - uav_only_scenario
  - presentation_contract
  - lod2_source_complete
  - lod2_alignment
  - lod2_mesh_valid
  - lod2_conversion_fixtures
  - relative_contact_reports
  - publication_contract
  domain_checks: []
presentation:
  intent: educational_visibility_simulation
  primary_view: threejs_3d
  layout:
    type: map_with_sidebar
    sidebar:
      organization: tabs
      section_state: collapsible
      tabs:
      - id: scenario
        title: Scenario
        sections:
        - scenario_controls
        - playback
        - tracks
        - legend
      - id: layers
        title: Layers
        sections:
        - layer_controls
        - legend
      - id: sources
        title: Sources
        sections:
        - provenance
        - assumptions
        - validation
  controls:
    reconfigurable: true
    canonical_reset: true
    off_canonical_labelling: required
    defaults:
      uavHeight: 50
      uavs: 1
    zoneSpacingM: 20
    probabilityThreshold: 0.25
    layer_defaults:
      red: true
      yellow: true
      green: true
      buildings: true
      vegetation: true
      roads: true
      predictions: true
      traces: true
      los: true
      uncertainty: true
      affiliations: true
      ground: true
      obstructions: true
      scenario: true
    playback_defaults:
      playing: true
      speed: 1
      time: 0
  map:
    implementation: 'Three.js explicitly requested by issue #1'
    basemap:
      id: helsinki-2021-orthophoto
      kind: raster-wms
      url: data/basemap.jpg
      attribution: © Helsingin kaupunkimittauspalvelut 2021 · CC BY 4.0 · modified
      default_visible: true
      note: Offline byte-pinned WMS image; actual remote request in source lock.
    layer_groups:
    - id: ground
      title: Ground & photography
    - id: obstructions
      title: Buildings & vegetation
    - id: scenario
      title: SIMULATED vectors & zones
    layers:
    - source: dtm
      group: ground
      semantic_role: source
      geometry: raster
    - source: photo_cog
      group: ground
      semantic_role: context
      geometry: raster
    - source: roads
      group: ground
      semantic_role: context
      geometry: line
    - source: buildings_cog
      group: obstructions
      semantic_role: constraint
      geometry: raster
      note: Analysis-only LiDAR roof raster, retained in QGIS; web building display
        uses independent official LoD2 geometry.
    - source: building_roofs
      group: obstructions
      semantic_role: source
      geometry: polygon
      web_geometry: building_mesh
      note: Official LoD2 source context only; analysis remains LiDAR DSM
    - source: vegetation_cog
      group: obstructions
      semantic_role: constraint
      geometry: raster
    - source: scenario
      group: scenario
      semantic_role: hypothetical
      geometry: point
    - source: default_zones_cog
      group: scenario
      semantic_role: primary_result
      geometry: raster
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_assumptions: true
  legend:
    visible: true
    mode: semantic
  coordinates:
    display: MGRS
    accuracy_digits: 5
    internal: EPSG:3067
    secondary: EPSG:3067 optional
    datum_note: ETRS89 to WGS84 display approximation; 1 m grid, not survey accuracy
  tracks:
    past_seconds: 120
    past_style: faint dotted
    future_seconds: 300
    future_style: amber dashed
    uncertainty: speed hypotheses 0.8/1.0/1.2; sampled envelope, not calibrated probability
  contact_report:
    basis: derived from SIMULATED tracks; same worker snapshot as LOS
    north_reference: EPSG:3067 grid north / UTM 35N
    angular_unit: 6400 mil per turn and degrees
    convergence: signed clockwise grid north from true north; true = grid + convergence
      at OWN
    own_height_agl_m: 2
    range_rate: horizontal range derivative; stationary own; negative closing, positive
      opening
    course: ground track of outgoing source route segment; not body heading
    magnetic_reference: unavailable; declination not modelled
  theme:
    name: tactical_dark
    affiliation_note: APP-6-inspired only; not certified symbology
    uav:
      semantic_role: hypothetical
      affiliation: hostile
      frame: diamond
      colour: '#ff7074'
    own_position:
      semantic_role: selected_feature
      affiliation: friendly
      frame: rectangle
      colour: '#75baff'
    readout_font: monospace
    result_statuses:
      RED: Current geometric visibility
      YELLOW: At least 0.25 of speed scenarios visible within 300 s
      GREEN: No visibility in the sampled scenario; not a safety claim
      UNKNOWN: Missing coverage or obstructed target
