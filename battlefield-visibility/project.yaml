overrides:
- id: SCENARIO-1
  action: add_scenario
  layer: simulated_anchors
  geometry_file:
    path: data/overrides/scenario.geojson
  geometry_origin: scenario
  rationale: Hypothetical force/target anchors copied from actual OSM nodes, explicitly
    simulated.
  evidence:
  - type: issue
    value: https://github.com/jaakla/openmapstack-samples/issues/1#issuecomment-6233311665
  created_at: '2026-10-17T11:30:00Z'
  created_by: scenario
processing:
  analysis_crs: EPSG:3067
  storage_crs: EPSG:3067
  bbox:
  - 385200
  - 6671300
  - 386500
  - 6672500
  resolution_m: 1
  max_ground_fill_m: 60
  vegetation_min_agl_m: 2
  steps:
  - id: lidar
    operation: stream_reproject_classify_grid
    inputs:
    - lidar_672496a
    - lidar_672496b
    - lidar_672496c
    - lidar_672496d
    - lidar_672497a
    - lidar_672497b
    - lidar_673496a
    - lidar_673496c
    - lidar_673497a
    output: surfaces
    crs: EPSG:3067
  - id: building_mesh
    operation: decode_official_b3dm_node_axis_rtc_ecef_clip_quantize_glb
    inputs:
    - surfaces
    - lod2_tileset
    - lod2_37306_5429
    - lod2_37306_5430
    - lod2_37306_5431
    - lod2_37307_5429
    - lod2_37307_5430
    - lod2_37307_5431
    - lod2_37308_5429
    - lod2_37308_5430
    - lod2_37308_5431
    - lod2_37309_5429
    - lod2_37309_5430
    - lod2_37309_5431
    - lod2_37310_5429
    - lod2_37310_5430
    - lod2_37310_5431
    output: building_geometry
    crs: EPSG:3067 / N2000, local GLB east-up-south
  - id: network
    operation: filter_source_topology_and_derive_simulation_routes
    inputs:
    - osm
    - tile_index
    - surfaces
    output: street_scenario
    crs: EPSG:3067
  - id: photography
    operation: georeference_pinned_2021_wms_snapshot
    input: orthophoto
    output: basemap
    crs: EPSG:3067
  - id: models
    operation: copy_licensed_original_uav_glb
    inputs:
    - uav
    output: props
    crs: non-geographic simulation props
  - id: publish
    operation: write_config_and_provenance
    inputs:
    - surfaces
    - street_scenario
    - basemap
    - props
    - building_geometry
    output: web_products
    crs: EPSG:3067
  - id: baseline
    operation: shared_node_browser_visibility_engine_at_defaults
    input: web_products
    output: default_visibility
    crs: EPSG:3067
  - id: desktop
    operation: write_qgis_with_validated_relative_layers
    inputs:
    - surfaces
    - street_scenario
    - basemap
    - default_visibility
    - building_geometry
    output: desktop_project
    crs: EPSG:3067
