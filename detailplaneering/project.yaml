validation:
  required:
  - source_hashes_match
  - independent_grid_reference
  - plot_area_matches_drawing
  - context_coverage
  - proposed_ground_labels
  - overrides_applied
  - height_limits_consistent
  - context_api_complete
  - thematic_registration
  - thematic_content
  - ditch_source_location
  - geometry_valid
  - feature_ids_unique
  - context_selection_exact
  - mahud
  - ajakohasus
  - dokumendid
  - menetlus
  - reljeef
  - kasutustingimused
  - teemakihid
  domain_checks: []
presentation:
  design_language: openmapstack-views/0.1
  intent: analytical_workspace
  primary_view: map
  layout:
    type: map_with_sidebar
    sidebar:
      position: left
      width: medium
      organization: tabs
      section_state: collapsible
      tabs:
      - id: explore
        title: Explore
        sections:
        - summary
        - layer_controls
        - scenario_controls
      - id: sources
        title: Sources
        sections:
        - credits
        - provenance
        - assumptions
        - warnings
        - validation
  controls:
    reconfigurable: true
    canonical_reset: true
    off_canonical_labelling: required
    filters: []
    scenarios: []
    variants:
    - id: view_mode
      type: choice
      label: Planeering / Olemasolev
      options:
      - proposal
      - existing
      canonical: proposal
      effect: published
      output: planned
  map:
    engine_preference: maplibre
    interaction:
      feature_select: true
      hover_tooltip: false
      zoom_to_selection: false
    basemap:
      id: goplex-protomaps
      kind: vector-style
      url: https://tiles.goplex.ee/styles/5.7.2/white.json
      dark_url: https://tiles.goplex.ee/styles/5.7.2/dark.json
      tilejson: https://tiles.goplex.ee/planet-20261006.json
      attribution: © OpenStreetMap contributors, Protomaps tiles by goplex.ee
      default_visible: true
    layer_groups:
    - id: proposal
      title: Planeeritud hooned
      default_open: true
    - id: existing
      title: Olemasolevad hooned
      default_open: true
    - id: plots
      title: Krundid ja kasutus
      default_open: true
    - id: drawing
      title: Joonise ülekattekiht
      default_open: true
    - id: context
      title: Ümbrus 1 km ulatuses
      default_open: true
    - id: utilities
      title: Tehnovõrgud
      default_open: false
    - id: relations
      title: Mõjuala seosed
      default_open: false
    layers:
    - source: context
      group: context
      semantic_role: context
      geometry: polygon
    - source: plots
      group: plots
      semantic_role: planned
      geometry: polygon
    - source: surfaces
      group: proposal
      semantic_role: planned
      geometry: polygon
    - source: drawing
      group: drawing
      semantic_role: source
      geometry: raster
      style:
        opacity: 0.7
    - source: existing
      group: existing
      semantic_role: source
      geometry: polygon
    - source: planned
      group: proposal
      semantic_role: planned
      geometry: polygon
    - source: boundary
      group: proposal
      semantic_role: selected_feature
      geometry: polygon
    - source: utilities
      group: utilities
      semantic_role: source
      geometry: line
    - source: relations
      group: relations
      semantic_role: source
      geometry: mixed
  legend:
    visible: true
    mode: semantic
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_override_badge: true
    show_assumptions: true
    credits:
      generated_with: true
      analysis_timestamp: runs.latest.completed_at
      author: true
  editing:
    allow_draw_geometry: false
    allow_attribute_override: false
    allow_hide_source_feature: false
    allow_add_annotation: false
runtime:
  implementation:
    preferred_engine: shapely-gdal
    pipeline: pipeline.py
    dependencies:
    - geometry.py
    - raster.py
    - sources.json
    - requirements.txt
    - package.json
    - package-lock.json
    - vite.config.js
    - index.html
    - src/main.jsx
    - src/MapView.jsx
    - src/Sidebar.jsx
    - src/styles.css
    - themes.py
    - src/mapStyles.js
    - data/source/vector-basemap/light.json
    - data/source/vector-basemap/dark.json
    - data/source/vector-basemap/tilejson.json
  environment:
    python: 3.14.4
    gdal: 3.12.3
warnings:
- id: mahud
  severity: medium
  statement: 3D-hooned on joonisel kujutatud hoonealuste pindade ja lubatud parapetikõrguste
    põhjal loodud tinglikud mahud, mitte kinnitatud arhitektuursed lahendused. Maapinna
    orienteeruv kõrgus võetakse sama krundi lähimast planeeritud kõrgusmärgist.
  mitigation: Inspect the supplied documents and source metadata; preserve the stated
    uncertainty.
  layer: planned
  issue: massing
- id: ajakohasus
  severity: medium
  statement: Olemasolevate hoonete, ortofotode ja reljeefi vaatlusajad erinevad. Andmed
    laaditi alla 26.10.2026; nende vastavust tänasele olukorrale pole kohapeal kontrollitud.
    Teadmata kõrgusega hooned kuvatakse tasapinnaliste kontuuridena.
  mitigation: Inspect the supplied documents and source metadata; preserve the stated
    uncertainty.
  layer: existing
  issue: vintage
- id: dokumendid
  severity: medium
  statement: Korralduse kokkuvõttes on 21 ehitatavat krunti, põhijoonisel aga 24 elamu-
    või ärikrunti. Pos 14 lubab kahte hoonet, kuid kujutab üht ühendatud kontuuri.
    Vaade järgib esitatud joonist ega lahenda dokumentide erinevusi. Joonise kruntide
    kogupindala on 10,18 ha, seletuskiri kirjeldab 10,9 ha suurust ala.
  mitigation: Inspect the supplied documents and source metadata; preserve the stated
    uncertainty.
  layer: planned
  issue: documents
- id: menetlus
  severity: medium
  statement: Korraldusega nr 737 võeti planeering vastu ja suunati avalikule väljapanekule
    26.10.–09.11.2026. See ei tähenda planeeringu kehtestamist.
  mitigation: Inspect the supplied documents and source metadata; preserve the stated
    uncertainty.
  layer: planned
  issue: status
- id: reljeef
  severity: medium
  statement: Reljeefi kuvamiseks on ametlikust maapinnamudelist võetud 5 m sammuga
    kõrgused. Planeeritud hoonete maapinnakõrgused põhinevad joonise orienteeruvatel
    kõrgusmärkidel. Kavandatud pinnasetöid, katusekaldeid, fassaade ja taimestiku
    ruumkuju pole modelleeritud.
  mitigation: Inspect the supplied documents and source metadata; preserve the stated
    uncertainty.
  layer: existing
  issue: terrain
- id: kasutustingimused
  severity: medium
  statement: Esitatud planeeringujooniste taaskasutustingimusi pole eraldi kontrollitud.
    Viited autorile AB Artes Terrae OÜ ja Tartu Linnavalitsusele on säilitatud.
  mitigation: Inspect the supplied documents and source metadata; preserve the stated
    uncertainty.
  layer: planned
  issue: licensing
- id: teemakihid
  severity: medium
  statement: Tehnovõrgud ning mõjuala liikumissuunad, bussipeatused ja maakasutuse
    märkused on taastatud 17.09.2026 PDF-joonistelt. Võrkude sügavusi pole määratud;
    mõjuala kirjeldused ei kinnita tänast maakasutust ega bussiliiklust. OSM-vektoraluskaart
    vajab internetiühendust.
  mitigation: Kontrolli algjoonist ja ajakohaseid võrguandmeid. Võrguühenduseta kasuta
    kohalikku Maa-ameti aluskaarti või ortofotot.
  layer: utilities
  issue: source-derived-thematic-context
