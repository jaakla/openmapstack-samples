# Proposed Tallinn tram lines compared in this project  --  HYPOTHETICAL scenario definitions.
#
# Nothing here is a fact of a geodata source. Each option is an analyst's reading of
# public documents and news (see `evidence`), declared as:
#   waypoints  ordered; an existing public transport stop in the pinned GTFS feed
#              ({stop: NAME, mode: tram|any}), the meeting point of two named streets
#              ({junction: [A, B]}) or a registered building address ({address: A}).
#              No coordinate is typed by hand.
#   streets    street names (as in the street network) the line follows.
#              An option with `follow: study_corridors_2019` is routed on the city's drawing of
#              the 2019 study corridors instead of the street network; there a waypoint may also be
#              the start or end of one line of that drawing, named by its FID
#              ({corridor_end: {fid: N, part: 0, end: start|end}}).
#   stand_in_streets  mapped streets used where the described corridor has no street of its
#              own (a former railway, a park); reported per option, with a geometry_note.
# pipeline.py (step 7) resolves the waypoints against the immutable sources and routes
# the line along the street network; an option that does not resolve is rejected.
#
# `strategy` is a documented judgement, scored with one rubric for every option:
#   sump        Tallinn sustainable urban mobility plan 2035, Table 1:
#               1 = "planned" tram line, 0.5 = "prospective corridor", 0 = not listed
#   study_2019  Tallinn & Harju light-rail feasibility and cost-benefit study, stage of the corridor:
#               1 = stage 1-2, 0.5 = stage 3, 0.25 = stage 4-5, 0 = not studied.
#               The report shows the stages on maps only; the stage is read from the `etapp` attribute
#               of the city's drawing of the study corridors (their lengths per stage match the
#               report's totals). pipeline.py re-reads it from the drawing and validation compares.
#   city_2026   position of the city government in 2026:
#               1 = funded and proceeding, 0.5 = named by the city as a candidate for the next extension,
#               0.25 = no stated position, 0 = decided against (or another mode chosen for the corridor)
# strategy fit = sum of the three (0-3).
#
# `appraisal_2019` quotes the 2019 study's own result for the corridor an option belongs to
# (final report, Tables 45, 61 and 62, tram variant): infrastructure cost in million EUR (2019
# prices) and, for the four scenarios [Tallinn+ free public transport, Tallinn+ paid, Tallinn++ free,
# Tallinn++ paid], the benefit-cost ratio (bcr) and socio-economic net present value (enpv_meur,
# million EUR at 5 %). The study appraises corridors, which are not always the same extent as an
# option here; `note` says where they differ. Quoted for reference, never used in the score.
#
# `published` figures are quoted for reference only and are never used in the score.
# Costs are infrastructure estimates in the price level of the year given.
