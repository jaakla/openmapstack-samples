# The five development stages of the 2019 Tallinn & Harju light-rail feasibility and cost-benefit
# study, and the corridors in each  --  a TRANSCRIPTION of the report, joined to the city's drawing.
#
# Source: "Tallinna ja Harjumaa kergrööbastranspordi teostatavus- ja tasuvusanalüüs" (2019), final
# report: chapter 1.6 "Etapilise arendamise kava" (stage maps and stage totals, pp. 11-17), chapter 8
# (the corridors of each stage, pp. 219-228), Table 45 (infrastructure cost, tram variant), Tables 61
# and 62 (net present value and benefit-cost ratio per corridor, tram variant) and Table 65 (per stage).
#
# The city publishes the corridors as lines with two attributes only, FID and etapp (stage); the
# corridor codes are printed on the report's maps. `lines` joins each code to the FIDs of the drawing
# by comparing the drawing with those maps. pipeline.py checks that every line of the drawing is
# named here exactly once, that the stage given here equals the `etapp` of each line, and that the
# drawn length of each stage agrees with the report's total. It does not check the transcribed figures.
#
#   mode       tram = new light-rail corridor; railway = existing railway taken into passenger use
#   lines      FIDs in data/source/corridors-feasibility-study-2019.geojson
#   table      row of Tables 45, 61 and 62 the figures are quoted from (several corridors can share one)
#   cost_meur  infrastructure cost, million EUR, 2019 prices (Table 45)
#   bcr, enpv_meur  for the four scenarios [Tallinn+ free public transport, Tallinn+ paid,
#              Tallinn++ free, Tallinn++ paid]; enpv in million EUR at 5 %
#   length_report_km, bcr_tram, bcr_brt, enpv_meur of a stage: chapter 1.6 and Table 65
