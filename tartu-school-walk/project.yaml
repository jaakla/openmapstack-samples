validation:
  required:
  - geometry_valid
  - crs_known
  - row_count_gt_zero
  - no_duplicate_building_id
  - no_null_building_id
  - source_semantics_verified
  - source_result_complete
  - source_licenses_resolved
  - overrides_applied
  - manifest_graph_resolves
  - view_controls_match_pipeline
  - qgis_project_static_valid
  - qgis_runtime_load
  - manifest_report_parity
  domain_checks:
  - name: population_conserved
    expression: allocated residents = grid residents in every cell touching Tartu (no unallocated cell)
  - name: tartu_population_plausible
    expression: 90000 <= SUM(pop_est) <= 108000
  - name: school_snap_distance
    expression: MAX(network_gap_m) <= 150 for schools in any set
  - name: network_connected
    expression: main component holds >= 95 % of the walkable network length
  - name: walk_distance_finite
    expression: walk_m_basic_all is finite and >= 0 for every inhabited building
  - name: coverage_monotonic
    expression: served population never falls when minutes rise or when a school set gains schools
  - name: table_totals_consistent
    expression: area_summary totals = coverage_matrix canonical row = building-level sums
presentation:
  intent: analytical_workspace
  primary_view: map
  language: en
  layout:
    type: map_with_sidebar
    sidebar:
      position: left
      width: large
      organization: tabs
      section_state: collapsible
      tabs:
      - id: analysis
        title: Analysis
        sections:
        - summary
        - metrics
        - unserved_areas
        - area_table
        - assumptions
        - warnings
      - id: map
        title: Map
        sections:
        - scenario_controls
        - layer_controls
        - legend
        - basemap
      - id: provenance
        title: Provenance
        sections:
        - credits
        - provenance
        - overrides
        - validation
        - outputs
        - run_record
  tables:
  - output: area_summary
    title: Districts and settlements
    downloads:
    - csv
    - xlsx
    default_sort: pop_unserved_15min
  - output: coverage_matrix
    title: Sensitivity – school set and walk limit
    downloads:
    - csv
    - xlsx
    default_sort: variant
  controls:
    reconfigurable: true
    canonical_reset: true
    off_canonical_labelling: required
    filters:
    - id: walk_minutes
      label: Walking time limit
      type: choice
      fields:
      - walk_m_basic_all
      - walk_m_municipal_basic
      - walk_m_all_schools
      unit: minutes
      canonical: 15
      options:
      - 5
      - 10
      - 15
      - 20
      redraws:
      - walkshed_variants
      - unserved_area_variants
      note: Re-applies the limit to the walking distance the pipeline measured for each building; polygons
        switch between precomputed variants.
    views:
    - id: school_set
      label: Schools counted
      options:
      - basic_all
      - municipal_basic
      - all_schools
      canonical: basic_all
      output: coverage_matrix
      fields:
        basic_all:
        - pop_served
        - pop_unserved
        - pct_unserved
        municipal_basic:
        - pop_served
        - pop_unserved
        - pct_unserved
        all_schools:
        - pop_served
        - pop_unserved
        - pct_unserved
  map:
    engine_preference: maplibre
    interaction:
      feature_select: true
      hover_tooltip: true
      zoom_to_selection: true
    basemap:
      id: goplex-protomaps
      kind: vector-style
      url: https://tiles.goplex.ee/styles/5.7.2/white.json
      dark_url: https://tiles.goplex.ee/styles/5.7.2/dark.json
      tilejson: https://tiles.goplex.ee/planet-20261006.json
      attribution: © OpenStreetMap contributors, Protomaps tiles by goplex.ee
      default_visible: true
      note: Reference background only, not an analysis input. The QGIS companion uses the Maa- ja Ruumiamet
        base map WMS, with OpenStreetMap XYZ as an unchecked alternative.
    layer_groups:
    - id: unserved
      title: Unserved areas
      default_open: true
    - id: buildings
      title: Homes by walking time
      default_open: true
    - id: schools
      title: Schools
      default_open: true
    - id: overrides
      title: Manual exclusions
      default_open: true
    - id: walkshed
      title: Walkshed
      default_open: true
    - id: context
      title: Districts and population grid
      default_open: false
    layers:
    - source: admin_areas
      group: context
      semantic_role: context
      geometry: polygon
      style:
        visual_priority: muted
        outline: solid
    - source: population_grid_cells
      group: context
      semantic_role: source
      geometry: polygon
      default_visible: false
      style:
        visual_priority: muted
    - source: walkshed_15min
      group: walkshed
      semantic_role: constraint
      geometry: polygon
      note: Network reach, drawn with up to 50 m beside reached paths; not the served/unserved rule (A6).
      style:
        visual_priority: muted
        opacity: 0.16
    - source: residential_buildings_gpkg
      group: buildings
      semantic_role: secondary_result
      geometry: polygon
      style:
        visual_priority: secondary
        classes: coverage_class
    - source: unserved_areas
      group: unserved
      semantic_role: primary_result
      geometry: polygon
      style:
        visual_priority: primary
        outline: dashed
    - source: schools
      group: schools
      semantic_role: source
      geometry: point
      filter: status = 'active'
      style:
        visual_priority: primary
    - source: schools
      group: overrides
      semantic_role: user_override
      geometry: point
      filter: status = 'excluded_by_override'
      note: OVERRIDE-001 and OVERRIDE-002, source records not counted as schools.
      style:
        visual_priority: secondary
        outline: emphasised
  legend:
    visible: true
    mode: semantic
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_override_badge: true
    show_assumptions: true
    credits:
      generated_with: true
      analysis_timestamp: runs.latest.completed_at
      author: true
  editing:
    allow_draw_geometry: false
    allow_attribute_override: false
    allow_hide_source_feature: false
    allow_add_annotation: false
warnings:
- id: METHOD-001
  severity: medium
  layer: residential_buildings
  issue: population_is_estimated
  statement: Residents per building are estimated by sharing each 1 km grid cell's official 2024 population
    among residential footprints by floor area. Totals per cell are exact; the split inside a cell is
    a model. Counts for small pockets are indicative.
  mitigation: Read percentages at district level or above with confidence; verify individual buildings
    against the population register before consequential decisions.
- id: METHOD-002
  severity: medium
  layer: walkshed_15min
  issue: network_model_limitations
  statement: Walking distances depend on OpenStreetMap paths, crossings and access tags as packaged by
    Overture. School locations are the city's points, not verified gates; the door-side leg is a straight
    line. Fences, missing footpaths or informal shortcuts are not modelled.
  mitigation: Check access on the ground for pockets close to the 15-minute limit.
- id: DATA-001
  severity: medium
  layer: schools
  issue: schools_outside_tartu_missing
  statement: Schools in neighbouring municipalities are not in the city layer, so walking times for border
    areas (Märja, parts of Raadi-Kruusamäe and Ihaste) are upper bounds.
  mitigation: Add neighbouring schools as an override layer if cross-border attendance matters.
- id: DATA-002
  severity: low
  layer: schools
  issue: license_not_stated
  statement: The Tartu city ArcGIS services do not publish explicit licence text for these layers.
  mitigation: Confirm reuse terms with Tartu City Government before redistributing the source snapshots.
- id: DATA-003
  severity: low
  layer: residential_buildings
  issue: temporal_mismatch
  statement: Population refers to 2024, schools and parcels to November 2026, network and footprints to
    October 2026. Homes built after 2024 carry no residents here.
  mitigation: Rerun when Statistics Estonia publishes a newer grid.
runtime:
  implementation:
    preferred_engine: geopandas + shapely (GEOS) + scipy
    pipeline: pipeline.py
    dependencies:
    - view.py
    - qgis_build.py
    - dashboard.template.html
    - requirements.txt
    - vendor/maplibre-gl.js
    - vendor/maplibre-gl.css
  environment:
    python: '3.13'
    gdal: bundled with pyogrio wheels
    proj: bundled with pyproj wheels
    qgis: 3.34 (optional; PyQGIS builds and verifies project.qgz when present)
    packages:
    - geopandas==1.2.0
    - shapely==2.2.0
    - pyproj==3.8.0
    - pyogrio==0.13.0
    - pyarrow==26.0.1
    - scipy==1.18.1
    - numpy==2.5.3
    - pandas==3.0.5
    - openpyxl==3.1.5
    - PyYAML==6.0.3
