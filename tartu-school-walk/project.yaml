        type: string
        label: Variant
      - name: school_set
        type: string
        label: School set
      - name: walk_minutes
        type: integer
        unit: min
        label: Walk limit
      - name: schools
        type: integer
        label: Schools
      - name: population
        type: integer
        unit: residents
        label: Residents (est.)
      - name: pop_served
        type: integer
        unit: residents
        label: Within limit
      - name: pop_unserved
        type: integer
        unit: residents
        label: Beyond limit
      - name: pct_unserved
        type: number
        unit: '%'
        label: Beyond limit
      - name: canonical
        type: boolean
        label: Accepted result
    downloads:
    - csv
    - xlsx
  area_summary_xlsx:
    path: data/derived/area-summary.xlsx
    format: XLSX
    kind: table
    generated_by: summarise
    role: download_format
    note: Spreadsheet copy of area_summary, written from the same rows in the same step.
  coverage_matrix_xlsx:
    path: data/derived/coverage-matrix.xlsx
    format: XLSX
    kind: table
    generated_by: summarise
    role: download_format
    note: Spreadsheet copy of coverage_matrix, written from the same rows in the same step.
  residential_buildings_gpkg:
    path: data/derived/residential-buildings.gpkg
    format: GeoPackage (EPSG:3301)
    generated_by: export
    note: QGIS-readable copy of residential_buildings (same rows and columns).
  qgis_project:
    path: project.qgz
