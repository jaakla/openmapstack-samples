schema: openmapstack-project/v1
project:
  id: tartu-school-walk
  title: Tartu schools – 15-minute walking coverage
  question: 'Map dashboard showing Tartu schools within 15-minute walking coverage: what areas and what
    share of the population are not served?'
  created_at: '2026-11-10T12:15:00+00:00'
  updated_at: '2026-11-10T13:13:42.291535+00:00'
  status: warning
  author:
    name: Jaak Laineste
    email: jaak.laineste@gmail.com
    url: https://github.com/jaakla
  generated_with:
    tool: OpenMapStack
    url: https://github.com/jaakla/openmapstack-skills
interpretation:
  objective: For every inhabited residential building in Tartu municipality, measure the walking distance
    along the pedestrian network to the nearest basic school, estimate how many residents live in it,
    and report the residents and the areas beyond a 15-minute walk.
  assumptions:
  - id: A1
    statement: '"Tartu" is the whole municipality (Tartu linn): the 18 city districts plus the 12 settlements
      of the former Tähtvere parish, as drawn in the city''s own administrative layer.'
    rationale: The city government is responsible for schooling in the whole municipality, and its population
      figures cover it. Results are also reported per district and settlement, so the urban core can be
      read separately.
  - id: A2
    statement: 'A 15-minute walk is 1200 m of network distance: 4.8 km/h (80 m per minute), including
      the straight-line gap between a building centroid and the nearest path and between the school point
      and the nearest path.'
    rationale: 4.8 km/h is a common planning speed for adults; children walk slower, so 15 minutes is
      optimistic for the youngest pupils. Thresholds of 5, 10 and 20 minutes are also materialised so
      the reader can test the sensitivity.
  - id: A3
    statement: '"School" means a general-education school that teaches the basic stage (grades 1-9) to
      school-age children and has open enrolment: the city layer''s types 1 (school of residence), 2 (citywide
      municipal school) and 4 (other Tartu school, mostly private). Special-needs schools (type 3) and
      records that describe only an upper-secondary stage (type 6) do not count in the accepted result.
      Two alternative school sets are materialised for comparison.'
    rationale: The question is about everyday walking access to school for children. A gymnasium stage
      or a special-needs school is not a school an ordinary 7-15-year-old can attend. Private schools
      are kept because they are real basic schools; the municipal-only variant shows the result without
      them.
  - id: A4
    statement: 'Residents are estimated per building: the population of each Statistics Estonia 1 km grid
      cell (reference year 2024) is shared among the residential building footprints whose centroid lies
      in the cell, in proportion to footprint area times estimated floors.'
    rationale: No open dataset gives residents per building. The official grid fixes the totals per square
      kilometre; footprint volume is the best available proxy for dwellings inside a cell.
  - id: A5
    statement: A footprint is residential when Overture classes it as a dwelling, or when it has no use
      class and its centroid lies on a cadastral parcel whose intended use includes residential land (ELAMUMAA).
      Footprints under 40 m² and footprints with a non-residential class get no residents. Outside Tartu,
      where the parcel layer does not exist, unclassed footprints count.
    rationale: 85 % of the footprints carry no use class, so land-use evidence from the cadastre is needed
      to keep residents out of industrial and commercial buildings.
  - id: A6
    statement: A building is served when its own measured walking distance is within the limit. The walkshed
      polygons are a drawing of the network reach (reached paths plus up to 50 m beside them) and never
      decide whether a building is served.
    rationale: Polygon overlap would count a large building as served when only a corner is in range.
  - id: A7
    statement: Only schools inside Tartu municipality are considered, as listed by the city.
    rationale: The city layer holds no schools of neighbouring municipalities. Residents near the border
      (for example Märja, next to Tõrvandi and Ülenurme) may have a closer school outside Tartu, so their
      walking time is an upper bound.
