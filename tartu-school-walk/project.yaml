    format: GeoJSON (EPSG:4326)
    generated_by: apply_school_overrides
  walkshed_15min:
    path: data/derived/walkshed-15min.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: draw_walksheds
  walkshed_variants:
    path: data/derived/walkshed-variants.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: draw_walksheds
    role: exploratory_companion
    note: Precomputed walksheds for every school set and time threshold the view offers. Never the accepted
      result; walkshed_15min is.
  unserved_areas:
    path: data/derived/unserved-areas.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: delineate_unserved_areas
  unserved_area_variants:
    path: data/derived/unserved-area-variants.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: delineate_unserved_areas
    role: exploratory_companion
    note: Precomputed unserved areas for every school set and time threshold the view offers. Never the
      accepted result; unserved_areas is.
  admin_areas:
    path: data/derived/admin-areas.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: summarise
  population_grid_cells:
    path: data/derived/population-grid.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: summarise
  area_summary:
    path: data/derived/area-summary.csv
    format: CSV
    kind: table
    generated_by: summarise
    table:
      key:
      - area_name
      columns:
      - name: area_name
        type: string
        label: Area
      - name: area_type
        type: string
        label: Type
      - name: population
        type: integer
        unit: residents
        label: Residents (est.)
      - name: residential_buildings
        type: integer
        label: Inhabited buildings
      - name: pop_unserved_15min
        type: integer
        unit: residents
        label: Beyond 15 min
      - name: pct_unserved_15min
        type: number
        unit: '%'
        label: Beyond 15 min
      - name: share_of_city_unserved_pct
        type: number
        unit: '%'
        label: Share of all unserved
      - name: pct_unserved_10min
        type: number
        unit: '%'
        label: Beyond 10 min
      - name: pct_unserved_20min
        type: number
        unit: '%'
        label: Beyond 20 min
      - name: median_walk_min
        type: number
        unit: min
        label: Median walk
    downloads:
