overrides:
- id: OVERRIDE-001
  action: hide_source_feature
  target:
    source: schools
    feature_id: 24C7F5AF-33FC-4F56-8D2D-6AD97D4AC85B
    feature_name: Tartu Ülikooli teaduskool
  rationale: The University of Tartu Youth Academy offers extracurricular courses and olympiad training.
    It is not a general-education school a child attends daily, although the city layer lists it as a
    school of type 4.
  evidence:
  - type: url
    value: https://teaduskool.ut.ee/et
  created_at: '2026-11-10T12:50:00+00:00'
  created_by: analyst
- id: OVERRIDE-002
  action: hide_source_feature
  target:
    source: schools
    feature_id: 1454848D-C4B9-4D5A-A4CC-E6E7D863C9D0
    feature_name: Tartu Täiskasvanute Gümnaasium (P)
  rationale: The basic-school stage of Tartu Adult Gymnasium teaches adult learners in flexible study.
    It is not a school for school-age children, although the city layer lists it as type 4.
  evidence:
  - type: url
    value: https://www.ag.tartu.ee/
  created_at: '2026-11-10T12:50:00+00:00'
  created_by: analyst
processing:
  analysis_crs: EPSG:3301
  storage_crs: EPSG:4326
  parameters:
    walk_speed_kmh: 4.8
    walk_minutes:
    - 5
    - 10
    - 15
    - 20
    canonical_walk_minutes: 15
    school_sets:
      basic_all:
        liik:
        - 1
        - 2
        - 4
        label: Basic schools – municipal and private
      municipal_basic:
        liik:
        - 1
        - 2
        label: Municipal basic schools only
      all_schools:
        liik:
        - 1
        - 2
        - 3
        - 4
        - 6
        label: Every school record – incl. special-needs and upper-secondary
    canonical_school_set: basic_all
    network_step_m: 20
    off_path_allowance_m: 50
    walkshed_cell_m: 10
    min_footprint_m2: 40
    floor_height_m: 3
    unserved_buffer_m: 60
    unserved_min_pop: 10
  steps:
  - id: load_admin
    operation: read
    inputs:
    - admin_boundary
    - admin_districts
    - admin_settlements
    crs: EPSG:3301
    output: admin_areas_raw
  - id: load_schools
    operation: read
    source: schools
    crs: EPSG:3301
    output: schools_raw
  - id: apply_school_overrides
    operation: apply_override
    input: schools_raw
    overrides:
    - OVERRIDE-001
    - OVERRIDE-002
    verify: target id and name must match the immutable source before a record is hidden
    expression: active = Lopetamise_kp IS NULL AND not hidden; school sets by Liik
    output: schools_effective
  - id: load_population_grid
    operation: read
    source: population_grid
    crs: EPSG:3301
    note: gml:posList axis order (northing, easting) is swapped to x,y and checked against 1 km cells
    output: grid_cells
  - id: select_residential_buildings
    operation: spatial_join_filter
    inputs:
    - overture_buildings
    - residential_parcels
    - grid_cells
    - admin_areas_raw
    crs: EPSG:3301
    expression: footprint_m2 >= 40 AND (class IN dwelling classes OR (class IS NULL AND (centroid within
      ELAMUMAA parcel OR centroid outside Tartu)))
    reference_geometry: building centroid
    output: residential_candidates
  - id: allocate_population
    operation: dasymetric_allocation
    inputs:
    - grid_cells
    - residential_candidates
    crs: EPSG:3301
    weight: footprint_m2 * floors_est (num_floors, else height / 3 m, else class default)
    fallback: unclassed footprints when a populated cell has no residential candidate; otherwise reported
      unallocated
    output: buildings_population
  - id: build_walk_network
    operation: build_routing_graph
    source: overture_segments
    crs: EPSG:3301
    expression: subtype = 'road' AND class <> 'motorway' AND pedestrian access not denied
    network_step_m: 20
    component: largest connected component only
    output: walk_network
  - id: route_to_schools
    operation: multi_source_shortest_path
    inputs:
    - walk_network
    - schools_effective
    crs: EPSG:3301
    walk_speed_kmh: 4.8
    direction: undirected (walking)
    output: node_distances
  - id: draw_walksheds
    operation: network_service_area
    input: node_distances
    crs: EPSG:3301
    minutes:
    - 5
    - 10
    - 15
    - 20
    canonical_minutes: 15
    off_path_allowance_m: 50
    cell_m: 10
    output: walksheds
  - id: measure_buildings
    operation: network_distance_join
    inputs:
    - buildings_population
    - node_distances
    - walk_network
    - admin_areas_raw
    crs: EPSG:3301
    distance_basis: building centroid to nearest routing node (straight line) plus network distance to
      the nearest school
    max_walk_minutes: 15
    output: residential_buildings
  - id: delineate_unserved_areas
    operation: buffer_dissolve
    input: residential_buildings
    crs: EPSG:3301
    expression: walk distance > minutes * 80 m
    buffer_m: 60
    min_population: 10
    output: unserved_area_polygons
  - id: summarise
    operation: aggregate
    inputs:
    - residential_buildings
    - admin_areas_raw
    - grid_cells
    output: summaries
  - id: export
    operation: export
    inputs:
    - residential_buildings
    - schools_effective
    - walksheds
    - unserved_area_polygons
    - summaries
    formats:
    - GeoParquet
    - GeoJSON
    - GeoPackage
    - CSV
    - XLSX
    output: exported_files
  - id: build_qgis_project
    operation: render
    input: exported_files
    output: qgis_project_file
  - id: render_dashboard
    operation: render
    input: exported_files
    output: dashboard_file
outputs:
