overrides: []
processing:
  analysis_crs: EPSG:3301
  storage_crs: EPSG:4326
  steps:
  - id: lidar
    operation: crop_classify_grid_sample
    inputs:
    - lidar_588541
    - lidar_589541
    - lidar_588542
    - lidar_589542
    output: lidar_product
    crs: EPSG:3301
    parameters:
      bbox:
      - 541450
      - 6588400
      - 542650
      - 6589600
      grid_resolution_m: 2
      point_stride: 20
      ground_class: 2
  - id: city
    operation: decode_i3s_transform_quantize
    inputs:
    - city_model
    output: city_product
    crs: EPSG:3301
    parameters:
      quantization_m: 0.025
      lod: all intersecting root-child geometry; do not render children simultaneously
  - id: labels
    operation: transform_selected_reference_labels
    inputs:
    - place_labels
    - lidar_product
    output: label_product
    crs: EPSG:3301
  - id: photography
    operation: georeference_immutable_wms_snapshot
    inputs:
    - orthophoto
    output: photo_product
    crs: EPSG:3301
  - id: desktop
    operation: write_gpkg_and_qgis
    inputs:
    - city_product
    - label_product
    - lidar_product
    - photo_product
    output: desktop_product
    crs: EPSG:3301
  - id: publish
    operation: write_view_config_and_provenance
    inputs:
    - desktop_product
    output: atlas_product
    crs: EPSG:3301
