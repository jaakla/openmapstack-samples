validation:
  required:
  - crs_known
  - row_count_gt_zero
  - geometry_finite
  - source_result_complete
  - overrides_applied
  - manifest_graph_resolves
  - vertical_alignment
  - qgis_project_static_valid
  - qgis_style_parity
  - manifest_report_parity
  - interactive_tool_calculations
  - solar_reference_metric_alignment
  domain_checks: []
presentation:
  intent: heritage_exploration
  primary_view: threejs_3d
  layout:
    type: map_with_sidebar
    sidebar:
      organization: tabs
      section_state: collapsible
  controls:
    reconfigurable: true
    canonical_reset: true
    off_canonical_labelling: required
    defaults:
      mode: model
      buildings: true
      terrain: true
      vegetation: true
      labels: true
      sunlight: 65
      lighting: solar
      sunDate: '2026-10-15'
      sunTime: '13:00'
      sunShadows: true
  map:
    implementation: Three.js, explicitly requested by user
    interaction:
      feature_select: true
      zoom_to_selection: true
    basemap:
      id: national-orthophoto
      kind: raster-wms
      url: https://kaart.maaamet.ee/wms/fotokaart
      attribution: Maa- ja Ruumiamet · aerial photography snapshot 2026-10-15
      default_visible: true
    layer_groups:
    - id: survey
      title: Surveyed architecture
    - id: ground
      title: Ground & photography
    - id: returns
      title: Airborne LiDAR
    - id: reference
      title: Place labels
    layers:
    - source: terrain_cog
      group: ground
      semantic_role: secondary_result
      geometry: raster
    - source: orthophoto_image
      group: ground
      semantic_role: context
      geometry: raster
    - source: building_positions
      group: survey
      semantic_role: primary_result
      geometry: polygon
    - source: point_positions
      group: returns
      semantic_role: source
      geometry: point
    - source: places
      group: reference
      semantic_role: context
      geometry: point
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_assumptions: true
  instruments:
    measurement:
      basis: Straight Euclidean chord and horizontal separation in EPSG:3301
      mode: exploratory_user_requested
      mixed_vertical_datums: Withhold 3D distance and height difference; horizontal
        separation remains available
      export: toompea-exploratory-measurement/v1
    cross_section:
      basis: Actual source triangle intersections with a user-controlled vertical
        plane; no inferred interiors
      defaults:
        enabled: false
        bearing: 90
        offset: 0
        slab: false
        width: 4
        flip: false
      profile_axes: Grid station / source height; separate EH2000 terrain and EGM96
        architecture
      export: CSV of source intersection endpoints
    sun_study:
      algorithm: SunCalc 2.1.1 · Meeus astronomical algorithms
      time_zone: Europe/Tallinn
      true_north_correction: PROJ meridian convergence at the source coordinate origin
      shadows: Directional shadow map of observed architecture and terrain; LiDAR
        foliage does not cast shadows
      materials: Neutral study surfaces prevent baked photographic shadows from being
        mistaken for calculated shading
  landmark_flag:
    name: Estonian national flag · Pikk Hermann
    colors:
    - '#0072CE'
    - '#000000'
    - '#FFFFFF'
    height_width_ratio:
    - 7
    - 11
    reference_url: https://www.riigikantselei.ee/et/eestilipp
    reference_asset_url: https://www.riigikantselei.ee/sites/default/files/2022-04/Eesti%20lipp_06.04.2022.svg
    reference_snapshot: data/source/estonian-flag-reference-2022.svg
    visibility: World-oriented surveyed 3D cloth in all modes and lighting settings;
      independent of layers and clipping. Uniform display magnification at distant
      zooms is an annotation, not a measured dimension.
    minimum_display_extent_px: 24
    shading: Fixed world-space fill on the source triangle normals; preserve national
      hues and distinguish observed folds
  map_effects:
    vignette_strength: 0.22
    vignette_basis: Warm, elliptical edge shading applied to the WebGL map and exported
      scene image; UI overlays remain clear.
