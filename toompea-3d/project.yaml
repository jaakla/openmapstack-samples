schema: openmapstack-project/v1
project:
  id: toompea-digital-atlas
  title: Toompea Digital Atlas
  question: Build a museum-grade interactive 3D explorer of Tallinn Toompea strictly
    grounded in measured source data.
  created_at: '2026-10-15T17:26:15.600352+00:00'
  updated_at: '2026-10-16T07:59:19.483220+00:00'
  status: warning
  publication:
    updated_at: '2026-10-07T00:00:00Z'
    status: published
    author:
      name: Jaak Laineste
      email: jaak@goplex.ee
    generated_with:
      tool: OpenMapStack
      url: https://github.com/jaakla/openmapstack-skills
interpretation:
  objective: Three.js source-backed 3D explorer with a deterministic GIS audit project.
  assumptions:
  - id: A1
    statement: AOI is a cartographic rectangular crop in EPSG:3301, not a legal definition
      of Toompea hill.
    rationale: A bounded viewer needs a reproducible extent.
  - id: A2
    statement: 2 m terrain is the minimum of class-2 points in each cell, with nearest-cell
      interpolation in unobserved cells.
    rationale: Ground interpolation is an explicit derived surface, not a measured
      facade.
  - id: A3
    statement: Every twentieth valid source return is displayed. Raw high-density
      tiles are retained.
    rationale: Bound browser memory while preserving reproducibility.
  - id: A4
    statement: City EGM96 and LiDAR EH2000 elevations remain uncorrected; no survey-grade
      vertical alignment claim.
    rationale: No verified vertical-grid transformation was available.
  - id: A5
    statement: Survey-view lighting, sky brightness and material colors are illustrative;
      source dates differ. Sun-study direction follows the explicitly selected astronomical
      date/time.
    rationale: Scene appearance is not a claim of a simultaneous calibrated capture.
  - id: A6
    statement: User-requested interactive measurements and sections are computed in
      the browser over the published metric geometry, explicitly exploratory, and
      exportable with source run identity. They do not alter canonical geodata.
    rationale: The user explicitly requested free-form distance measurement and 3D
      cross sections; browser selections are live observations rather than published
      GIS findings.
  - id: A7
    statement: Solar direction is astronomical for the selected Tallinn local date/time;
      sky brightness, neutral materials and shadow softness are presentation models,
      not measured weather, irradiance or certified insolation.
    rationale: Date/time sun shading must distinguish calculated solar geometry from
      atmospheric and source-model limitations.
