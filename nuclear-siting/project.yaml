  statement: This is a desk screen on open data, not a site assessment. Four official exclusion criteria are not
    mapped (aerodrome protection zones, species protection sites, category I animals, feasibility of the emergency
    plan), and the non-public security criteria are absent. A remaining cell is not a suitable site.
  mitigation: Read candidate areas as land that survives the mapped exclusions. The state special plan and its strategic
    environmental assessment decide suitability.
- id: METHOD-002
  severity: medium
  layer: screening_grid
  issue: grid_resolution
  statement: Cells are about 260 m across and tested at their centre. Features narrower than a cell, such as single-object
    zones, monument zones, small key habitats and the shore building-ban zone, are sampled rather than fully represented,
    and the 350 m dwelling distance is measured from the centre.
  mitigation: Use the grid for regional comparison. Check any area of interest against the source layers at full
    detail.
- id: METHOD-003
  severity: medium
  layer: screening_grid
  issue: fault_buffer_is_conservative
  statement: The fault criterion buffers every mapped bedrock fault by 5 km. No Estonian fault is proven active,
    and the official plan judges faults site by site. This criterion alone removes several hundred square kilometres
    of coast.
  mitigation: Switch the criterion off, or change its distance, to see its effect.
- id: DATA-001
  severity: medium
  layer: official_sites
  issue: defence_criteria_not_public
  statement: The plan dropped its three Lüganuse sites in October 2026 on defence grounds that are not public. Public
    defence sites and their zones are mapped here; the non-public considerations are not.
  mitigation: Do not read a remaining cell as cleared on defence grounds.
- id: DATA-002
  severity: low
  layer: official_sites
  issue: license_not_stated
  statement: The map service that publishes the official sites and planning area (gis.skpk.ee) states no licence.
    The geometries are public planning material of a state special plan.
  mitigation: Confirm reuse terms with the Ministry of Economic Affairs and Communications before redistributing
    the snapshots.
- id: DATA-003
  severity: low
  layer: screening_grid
  issue: source_records_unplaceable
  statement: Four monument-zone records were served with coordinates that are not L-EST97 metres and were left out
    at acquisition. They are listed in data/source/acquisition.json.
  mitigation: Recheck when the heritage register corrects the records.
- id: DATA-004
  severity: low
  layer: screening_grid
  issue: temporal_mismatch
  statement: Population refers to 2024; all other layers are snapshots of 22 November 2026. The criteria follow
    the plan documents of 4 November 2026, which are a draft under public consultation.
  mitigation: Rerun acquire.py and the pipeline when the plan or the sources change.
