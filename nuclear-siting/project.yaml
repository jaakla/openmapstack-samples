overrides: []
processing:
  analysis_crs: EPSG:3301
  storage_crs: EPSG:4326
  parameters:
    cell_mercator_m: 500
    densify_m: 25
    population_radius_m: 5000
    distance_unit_m:
      d_sea: 100
      d_hazard: 100
      d_air_main: 250
      d_air_small: 100
      d_gas: 100
      d_fault: 100
      d_fault_basement: 100
      d_dwelling: 50
      d_border: 100
      d_grid: 250
      d_road: 100
      d_rail: 100
      d_port: 250
    canonical_criteria:
    - cooling_sea
    - underground_mining
    - faults
    - heritage
    - protected_areas
    - natura
    - conservation_areas
    - single_objects
    - key_habitats
    - dwellings
    - defence
    - water_bodies
    - land_border
    - land_area
    canonical_thresholds:
      cooling_sea: 3
      faults: 5
      dwellings: 0.35
      land_border: 5
      land_area: 95
    criteria_file: criteria.yaml
  steps:
  - id: build_grid
    operation: build_screening_grid
    inputs:
    - counties
    - municipalities
    crs: EPSG:3857 alignment; cell centres transformed to EPSG:3301
    cell_mercator_m: 500
    membership: cell centre inside a county polygon
    area: geodesic (GRS80), one value per grid row
    output: screening_cells
  - id: flag_areas
    operation: point_in_polygon
    inputs:
    - screening_cells
    - protected_areas
    - natura_birds
    - natura_habitats
    - conservation_areas
    - key_habitats
    - single_object_zones
    - heritage_monuments
    - heritage_zones
    - undermined_oil_shale
    - undermined_phosphorite
    - mining_claims
    - defence_objects
    - defence_zones
    - lakes
    - dense_settlements
    - karst
    - karst_fields
    - flood_hazard
    - flood_risk_2024
    - green_network
    - mineral_deposits
    - mires
    - groundwater_unprotected
    crs: EPSG:3301
    reference_geometry: cell centre
    output: cell_flags
  - id: measure_distances
    operation: nearest_distance
    inputs:
    - screening_cells
    - sea
    - hazardous_plants
    - airfields
    - gas_transmission_359
    - gas_transmission_3514
    - gas_transmission_3516
    - faults_bedrock
    - faults_basement
    - dwellings
    - defence_objects
    - power_lines_hv
    - main_roads
    - railways
    - ports
    crs: EPSG:3301
    distance_basis: straight line from the cell centre to points every 25 m along target lines and outlines
    densify_m: 25
    output: cell_distances
  - id: sample_terrain_and_population
    operation: sample_and_sum
    inputs:
    - screening_cells
    - dtm
    - population_grid
    crs: EPSG:3301
    population_radius_m: 5000
    output: cell_values
  - id: apply_criteria
    operation: filter
    inputs:
    - cell_flags
    - cell_distances
    - cell_values
    expression: a cell remains when it fails none of the canonical criteria of criteria.yaml at their thresholds
    output: cell_screen
  - id: require_contiguous_land
    operation: connected_components
    input: cell_screen
    connectivity: 4-neighbour
    min_area_ha: 95
    output: cell_candidates
  - id: delineate_candidate_areas
    operation: polygonize_and_summarise
    inputs:
    - cell_candidates
    - rep_planning_area
    crs: EPSG:3301 measures; polygons are unions of grid cells
    output: candidate_area_polygons
  - id: check_official_sites
    operation: overlay
    inputs:
    - cell_candidates
    - rep_sites
    - rep_site_areas
    crs: EPSG:3301
    output: official_site_check
  - id: summarise
    operation: aggregate
    inputs:
    - cell_candidates
    - candidate_area_polygons
    output: summaries
  - id: export
    operation: export
    inputs:
    - cell_candidates
    - candidate_area_polygons
    - official_site_check
    - summaries
    - airfields
    - hazardous_plants
    - ports
    - power_lines_hv
    - faults_bedrock
    - rep_planning_area
    formats:
    - GeoParquet
    - GeoJSON
    - CSV
    - XLSX
    output: exported_files
  - id: render_dashboard
    operation: render
    input: exported_files
    output: dashboard_file
  - id: render_findings
    operation: render
    input: exported_files
    output: findings_file
delivery:
  schema: openmapstack-delivery/v1
  targets:
  - id: dashboard
    kind: dashboard
    mode: local
    output: dashboard
    inputs:
    - screening_grid
    - candidate_areas
    - official_sites
    - reference_features
    - candidate_areas_table
    - criteria_catalogue
    - county_summary
    - official_sites_check
    evidence: dashboard_evidence
findings:
  schema: openmapstack-findings/v1
  output: findings
outputs:
  screening_grid:
    path: data/derived/screening-grid.parquet
