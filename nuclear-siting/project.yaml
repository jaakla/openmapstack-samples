validation:
  required:
  - geometry_valid
  - crs_known
  - layers_within_aoi
  - row_count_gt_zero
  - no_duplicate_cell
  - source_semantics_verified
  - source_result_complete
  - source_licenses_resolved
  - overrides_applied
  - manifest_graph_resolves
  - view_controls_match_pipeline
  - manifest_report_parity
  domain_checks:
  - name: land_area_plausible
    expression: geodesic area of the land cells is within 0.5 % of the area of the county polygons
  - name: stored_units_reproduce_rules
    expression: for every distance criterion and offered threshold, the rule on stored whole units equals the rule
      on measured metres
  - name: screen_monotonic
    expression: a stricter threshold never leaves more land; dropping a criterion never leaves less
  - name: candidate_areas_consistent
    expression: candidate cells are remaining cells; every area is at least 95 ha; area totals agree between the
      polygons and the grid
  - name: official_sites_located
    expression: all six official sites lie inside the official planning area and within 5 km of the sea
