schema: openmapstack-project/v1
project:
  id: nuclear-siting
  title: Estonia – screening for a nuclear power plant site
  question: 'Site selection for a future nuclear power station in Estonia: which known and logical preconditions
    apply, how strong is each, and which land remains when a chosen set of them is applied?'
  created_at: '2026-11-22T17:30:00+00:00'
  updated_at: '2026-11-22T17:52:42.865890+00:00'
  status: warning
  aoi:
    bbox:
    - 300000
    - 6300000
    - 800000
    - 6700000
    crs: EPSG:3301
  author:
    name: Jaak Laineste
    email: jaak.laineste@gmail.com
    url: https://github.com/jaakla
  generated_with:
    tool: OpenMapStack
    url: https://github.com/jaakla/openmapstack-skills
interpretation:
  objective: Catalogue the siting criteria of the Estonian state special plan for a nuclear power plant and of the
    2023 nationwide spatial analysis, with their class and thresholds; measure every criterion that open data can
    support on a nationwide grid; and report the land that remains when the mapped exclusion criteria are applied,
    with each criterion switchable in the view.
  assumptions:
  - id: A1
    statement: 'The study area is the land of Estonia: every grid cell whose centre lies inside a county polygon
      of the official administrative division.'
    rationale: A plant stands on land. County polygons follow the shoreline and include islands; inland lakes are
      handled by their own criterion.
  - id: A2
    statement: 'The screen is made on a grid aligned to Web Mercator with 500 m steps, about 255 to 270 m on the
      ground. Every test is made at the cell centre: a cell is inside an area when its centre is, and distances
      run from the centre.'
    rationale: A fixed grid lets any set of criteria be combined in the view without measuring in the browser. Aligning
      it to the map projection lets it be drawn exactly. All measuring is done in EPSG:3301.
  - id: A3
    statement: The accepted run applies every mapped criterion of class 'exclusion' at the official threshold and
      no criterion of class 'consideration' or 'suitability'.
    rationale: The official method removes exclusion areas first and weighs the other criteria site by site, without
      a summed score. Considerations are reported per candidate area and can be switched on in the view.
  - id: A4
    statement: 'Cooling water is taken from the sea, and the accepted threshold is the open-cycle one: at most 3
      km from the sea in a straight line.'
    rationale: The ministry states that no Estonian river has enough flow. The 2023 analysis used 3 km for open-cycle
      and 10 km for closed-cycle cooling; both are offered.
  - id: A5
    statement: Every bedrock fault of the 1:400 000 geological map is buffered by 5 km, as the 2023 screening did,
      although no Estonian fault is proven active.
    rationale: The official criterion concerns active faults, which only site investigations can establish. Buffering
      all mapped faults is the conservative screening choice and is switchable.
  - id: A6
    statement: A cell is too close to homes when its centre is nearer than 350 m to a residential building footprint.
    rationale: The plan keeps 350 m between dwellings and the reactor. Public buildings and plot boundaries, which
      the plan also excludes, are not in the open layer used.
  - id: A7
    statement: Enough land means remaining cells joined edge to edge that add up to at least 95 ha.
    rationale: The plan estimates 95 ha for two BWRX-300 units with their buffer. Diagonal contact does not join
      cells.
  - id: A8
    statement: Distances are straight lines from the cell centre to points placed every 25 m along the target lines
      and outlines, and are stored in whole units (50, 100 or 250 m) rounded down.
    rationale: The error is at most about 13 m, far below the cell size. Every offered threshold is a multiple of
      the unit, so stored values reproduce each rule exactly.
  - id: A9
    statement: Where the official rule needs data that is not open, a stand-in is used and the criterion is marked
      'proxy'; where there is no usable stand-in the criterion is listed as 'not mapped' and plays no part.
    rationale: The catalogue should show the whole official list and be explicit about what this screen can and
      cannot reproduce.
  - id: A10
    statement: 'Three exclusion criteria come from outside the plan''s 47-row screening table: limited-conservation
      areas (an exclusion layer of the plan''s public map), lakes and reservoirs, and 5 km from the land border
      (both exclusions of the 2023 nationwide analysis).'
    rationale: The plan's table was written for a planning area that these do not touch; a nationwide screen needs
      them.
