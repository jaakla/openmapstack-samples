name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without raw LFS survey downloads
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            toompea-3d/package-lock.json
            battlefield-visibility/package-lock.json
      - name: Install dependencies
        working-directory: toompea-3d
        run: npm ci
      - name: Test survey calculations
        working-directory: toompea-3d
        run: npm test
      - name: Build the atlas at its public URL
        working-directory: toompea-3d
        run: npm run build -- --base=/openmapstack-samples/toompea-3d/
      - name: Install Helsinki visibility dependencies
        working-directory: battlefield-visibility
        run: npm ci
      - name: Test Helsinki visibility and published products
        working-directory: battlefield-visibility
        run: npm test
      - name: Verify Helsinki run artifacts
        working-directory: battlefield-visibility
        run: node scripts/verify-products.mjs
      - name: Build Helsinki visibility at its public URL
        working-directory: battlefield-visibility
        run: npm run build -- --base=/openmapstack-samples/battlefield-visibility/
      - name: Assemble the site
        run: |
          mkdir -p _site/toompea-3d _site/battlefield-visibility _site/gallery
          cp -a toompea-3d/dist/. _site/toompea-3d/
          cp -a battlefield-visibility/dist/. _site/battlefield-visibility/
          cp index.html _site/index.html
          cp toompea-3d/docs/toompea-preview.png _site/gallery/toompea-preview.png
          cp battlefield-visibility/docs/uav-visibility-preview.png _site/gallery/uav-visibility-preview.png
          touch _site/.nojekyll
      - name: Upload the prepared static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
